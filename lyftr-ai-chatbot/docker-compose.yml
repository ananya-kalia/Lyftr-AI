version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lyftr_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////data/app.db
      - LLM_MODEL=${LLM_MODEL:-gemini/gemini-2.0-flash}
      - LLM_API_KEYS=${LLM_API_KEYS:-key_1:mock_key_1,key_2:mock_key_2}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - ENABLE_FAILURE_SIMULATION=true
      - LITELLM_OFFLINE_MODE=true
    volumes:
      # Named volume for persistent SQLite database across container restarts
      - sqlite_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000
    container_name: lyftr_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  sqlite_data:
    driver: local
